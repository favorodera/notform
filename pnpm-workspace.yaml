packages:
  - "apps/*"
  - "playgrounds/*"
  - "packages/*"

nodeOptions: "--max_old_space_size=4096"
shellEmulator: true

peerDependencyRules:
  allowedVersions:
    vite: "8"
    typescript: "6"

verifyDepsBeforeRun: false

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  better-sqlite3: true
  sharp: true

catalog:
  "@types/node": "^25.6.0"
  "@vitejs/plugin-vue": "^6.0.6"
  nuxt: "^4.4.6"
  vite: "^8.0.8"
  vue: "^3.5.34"
  vue-router: "^5.0.7"
  vue-tsc: "^3.2.6"
