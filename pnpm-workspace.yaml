nodeOptions: --max_old_space_size=4096

catalog:
  '@ai-sdk/google': ^4.0.105
  '@favorodera/eslint-config': ^3.1.0
  '@nuxt/kit': ^4.6.3
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.6.3
  '@standard-schema/spec': ^1.1.0
  '@types/node': ^26.6.5
  '@vitejs/plugin-vue': ^6.0.10
  '@vitest/coverage-v8': ^5.0.5
  '@vitest/ui': ^5.0.5
  '@vue/test-utils': ^2.5.1
  ai: ^7.0.153
  dequal: ^2.0.3
  dot-prop: ^10.2.0
  eslint: ^10.13.0
  happy-dom: ^21.0.4
  klona: ^2.0.6
  nuxt: ^4.6.3
  pkg-pr-new: ^0.0.92
  relizy: ^1.12.0
  tsdown: ^0.23.2
  turbo: ^2.11.10
  type-fest: ^5.10.0
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^5.0.5
  vue: ^3.5.44
  vue-tsc: ^3.3.13

allowBuilds:
  esbuild: true
  unrs-resolver: true
