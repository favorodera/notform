name: Bug Report
description: Report something that is broken or behaves unexpectedly
title: '[Bug]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A **reproduction** and the **version** you are using are what make a bug fixable. Everything else is optional.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        The fastest way is the [Playground](https://notform.favorodera.dev/playground). Reproduce the bug there, click **Share**, and paste the link. A minimal code snippet or repository works too. Add the steps if they are not obvious.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package and version you use, plus your Vue or Nuxt version.
      placeholder: 'e.g. notform@x.y.z with Vue 3.5, or @notform/nuxt@x.y.z with Nuxt 4'
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Browser, operating system, logs, screenshots, or anything else that might help.
    validations:
      required: false