name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: true
        type: choice
        options:
          - Select a version bump
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor

      prerelease_id:
        description: 'Prerelease identifier, such as alpha or beta'
        required: false
        type: string
        default: alpha

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  resolve:
    name: Resolve release choices
    runs-on: ubuntu-latest
    outputs:
      release_arguments: ${{ steps.build_release_arguments.outputs.arguments }}
    steps:
      - name: Validate Inputs
        id: validate_inputs
        uses: actions/github-script@v9
        with:
          script: |
            const { bump, prerelease_id } = context.payload.inputs

            // Stable releases use a standard semantic version bump.
            if (['patch', 'minor', 'major'].includes(bump)) {
              core.info(`Valid stable release bump: ${bump}`)
              return
            }

            // Prerelease releases require both a prerelease bump and an identifier such as alpha or beta.
            // Only lowercase letters are accepted, keeping the value safe to expand in the shell in the release job.
            if (['prerelease', 'prepatch', 'preminor', 'premajor'].includes(bump)) {
              if (!/^[a-z]+$/.test(prerelease_id ?? '')) {
                core.setFailed('A lowercase prerelease identifier (e.g. alpha, beta) is required for prerelease releases.')
                return
              }

              core.info(`Valid prerelease bump: ${bump}`)
              core.info(`Prerelease identifier: ${prerelease_id}`)
              return
            }

            core.setFailed(`Invalid release bump type: ${bump}`)

      - name: Build Release Arguments
        id: build_release_arguments
        uses: actions/github-script@v9
        with:
          script: |
            const { bump, prerelease_id } = context.payload.inputs

            // Stable releases only need the version bump. 
            // Prerelease also specify the prerelease identifier and publish under the matching npm distribution tag.
            const releaseArguments = ['patch', 'minor', 'major'].includes(bump)
              ? `--${bump}`
              : `--${bump} --preid ${prerelease_id} --tag ${prerelease_id}`

            core.setOutput('arguments', releaseArguments)
            core.info(`Release arguments: ${releaseArguments}`)

  release:
    name: Release (${{ inputs.bump }})
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Configure Git
        run: |
          git config --global user.name "favorodera"
          git config --global user.email "favorodera@gmail.com"

      - name: Release
        run: pnpm relizy release ${{ needs.resolve.outputs.release_arguments }} --yes --no-clean
        env:
          RELIZY_GITHUB_TOKEN: ${{ secrets.PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
